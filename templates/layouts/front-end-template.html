<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{site_title}}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="/static/js/lib/jquery-3.7.1.min.js" defer="defer"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/custom/style.css" />

  </head>
  <body>
    <div class="container">
      <header>
        <a href="/"><img src="/static/site-logo.jpg" /></a>
        
		<ul class="nav nav-tabs">
		  <li class="nav-item">
			<a class="nav-link {% if menu_tab_active == 'home' %}active{% endif %}" href="/">Home</a>
		  </li>
		  <li class="nav-item">
			<a class="nav-link {% if menu_tab_active == 'about_us' %}active{% endif %}" href="/about-us/">About Us</a>
		  </li>
		  <li class="nav-item">
			<a class="nav-link {% if menu_tab_active == 'contact_us' %}active{% endif %}" href="/contact-us/">Contact Us</a>
		  </li>
		  <li class="nav-item">
			<a class="nav-link {% if menu_tab_active == 'cv' %}active{% endif %}" href="/cv/">CV</a>

		  <li class="nav-item">
			<a class="nav-link {% if menu_tab_active == 'technologies' %}active{% endif %}" href="/technologies/">Technologies</a>
		  </li>      
		</ul>
	
      </header>
      <main class="container mt-4  py-3">
        <div class="mb-4 bg-light rounded-3">
		
			    {% block body %} {% endblock %} 
		
        </div>
